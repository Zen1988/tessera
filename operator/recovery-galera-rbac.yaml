apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tessera-recovery-galera
  namespace: mariadb
rules:
- apiGroups:
  - k8s.mariadb.com
  resources:
  - mariadbs
  resourceNames:
  - tessera-mariadb
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - tessera-mariadb-root
  - tessera-mariadb-ca-bundle
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tessera-recovery-galera
  namespace: mariadb
subjects:
- kind: ServiceAccount
  name: tessera-operator
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tessera-recovery-galera
