apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tessera-recovery-longhorn
  namespace: longhorn-system
rules:
- apiGroups:
  - longhorn.io
  resources:
  - volumes
  - engines
  verbs:
  - get
  - list
- apiGroups:
  - longhorn.io
  resources:
  - settings
  resourceNames:
  - replica-replenishment-wait-interval
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - daemonsets
  resourceNames:
  - longhorn-manager
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/eviction
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tessera-recovery-longhorn
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tessera-recovery-longhorn
subjects:
- kind: ServiceAccount
  name: tessera-operator
  namespace: apps
