    ,\n    \"postgres\",\n    \"awx\",\n    \"forgejo\",\n    \"elasticsearch\",\n\
    \    \"kube-system\",\n    \"mariadb-system\",\n    \"redis-system\",\n    \"\
    cnpg-system\",\n    \"elastic-system\",\n    \"default\"\n  ],\n  \"longhorn_namespace\"\
    : \"longhorn-system\",\n  \"metallb_namespace\": \"metallb-system\",\n  \"interval_seconds\"\
    : 60,\n  \"check_deadline_seconds\": 45,\n  \"max_workers\": 4,\n  \"targets\"\
    : []\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tessera-operator
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tessera-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tessera-operator
    spec:
      serviceAccountName: tessera-operator
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: observer
        image: docker.io/library/tessera-operator:0.3.2
        imagePullPolicy: Never
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: health
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /livez
            port: health
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /livez
            port: health
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/tessera-operator
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: tessera-operator
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - k8s.ncs.local
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tessera-operator-internal
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tessera-operator
  policyTypes:
  - Ingress
  ingress: []
