spec:
  replicas: 2
  template:
    spec:
      affinity:
        $patch: replace
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: tessera-operator
            topologyKey: kubernetes.io/hostname
      containers:
      - name: observer
        image: docker.io/library/tessera-operator:0.3.3
        args:
        - --recovery-config
        - /etc/tessera-operator/recovery.json
