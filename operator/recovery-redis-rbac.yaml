apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: tessera
  name: tessera-recovery-redis
rules:
- apiGroups:
  - apps
  resources:
  - statefulsets
  resourceNames:
  - tessera-redis-ha
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - tessera-redis-auth
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: tessera
  name: tessera-recovery-redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tessera-recovery-redis
subjects:
- kind: ServiceAccount
  name: tessera-operator
  namespace: apps
