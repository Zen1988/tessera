apiVersion: v1
kind: ConfigMap
metadata:
  name: tessera-recovery-state
  namespace: apps
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: tessera-recovery-leader
  namespace: apps
spec:
  leaseDurationSeconds: 120
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tessera-recovery-ledger
  namespace: apps
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - tessera-recovery-state
  verbs:
  - get
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - tessera-recovery-leader
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tessera-recovery-ledger
  namespace: apps
subjects:
- kind: ServiceAccount
  name: tessera-operator
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tessera-recovery-ledger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tessera-recovery-cnpg
  namespace: postgres
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  resourceNames:
  - tessera-postgres
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - get
  - create
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - pods/eviction
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tessera-recovery-cnpg
  namespace: postgres
subjects:
- kind: ServiceAccount
  name: tessera-operator
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tessera-recovery-cnpg
