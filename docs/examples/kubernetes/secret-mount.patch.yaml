# Strategic merge patch: adapt Deployment/container names and numeric IDs to
# your image. Apply the same mount to web, daemon, init and upgrade processes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tessera-web
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # EXAMPLE: confirm with id -u otobo in your image
        runAsGroup: 1000 # EXAMPLE: confirm with id -g otobo in your image
        fsGroup: 1000    # runtime group permitted to read mounted keys
      containers:
        - name: web
          volumeMounts:
            - name: tessera-credentials
              mountPath: /run/tessera-secrets
              readOnly: true
      volumes:
        - name: tessera-credentials
          secret:
            secretName: tessera-runtime-credentials
            optional: false
            defaultMode: 0440
            items:
              - key: db-password
                path: db-password
              - key: redis-password
                path: redis-password
              - key: api-token
                path: api-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tessera-daemon
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: daemon
          volumeMounts:
            - name: tessera-credentials
              mountPath: /run/tessera-secrets
              readOnly: true
      volumes:
        - name: tessera-credentials
          secret:
            secretName: tessera-runtime-credentials
            optional: false
            defaultMode: 0440
            items:
              - key: db-password
                path: db-password
              - key: redis-password
                path: redis-password
              - key: api-token
                path: api-token
