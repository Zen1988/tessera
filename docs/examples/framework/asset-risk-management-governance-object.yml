---
class: Framework
description: |-
  Infrastructure risk management framework at Workload (Server, database etc),
  NetworkNode, StorageNode or PeripheralNode where it can take in various
  factors.
fields:
  RiskMatrix:
  - ZRM-EndScore: '4'
    ZRM-RiskSeverity:
    - 'EventSeverity: Very Low'
    ZRM-StartScore: '1'
  - ZRM-EndScore: '9'
    ZRM-RiskSeverity:
    - 'EventSeverity: Low'
    ZRM-StartScore: '5'
  - ZRM-EndScore: '14'
    ZRM-RiskSeverity:
    - 'EventSeverity: Medium'
    ZRM-StartScore: '10'
  - ZRM-EndScore: '19'
    ZRM-RiskSeverity:
    - 'EventSeverity: High'
    ZRM-StartScore: '15'
  - ZRM-EndScore: '25'
    ZRM-RiskSeverity:
    - 'EventSeverity: Critical'
    ZRM-StartScore: '20'
  ZRM-Annex: ARM
  ZRM-MasterTicket: |-
    # Framework.ZRM-MasterTicket for Infrastructure Risk Framework.
    # ScriptEngine field assignments for Framework.ZRM-MasterTicket.
    # Execution waits until Framework.ZRM-RiskMgtStateBook points to a StateBook.
    VERSION: 1
    RETURN:
      AS: Ticket.ServiceRequest
      FIELD ASSIGNMENTS:
        Type: '"ServiceRequest"'
        Service: '"Risk::Management"'
        CustomerUser: '"tessera@ica.gov.sg"'
        Title: '@RISK.Name'
        ZRM-OriginatedEvent: '@RISK.MELTObjectID'
        ZRM-Framework: '@FRAMEWORK.GovernanceObjectID'
        # MELT-RelatedGO is the Risk's single GovernanceObject reference.
        # The runtime requires it to resolve to an Application.
        ZTicket-Application: '@RISK.MELT-RelatedGO'
        # Resolve the Application RoleMap through this administrator-owned role.
        # Store the resulting SupportProfile as the master risk owner.
        ZTicket-OwnerGroup: '"APPLICATION::DEFAULT"'
        ZTicket-StateBook: '@FRAMEWORK.ZRM-RiskMgtStateBook'
  ZRM-PolicyOwner:
  - 'Organization: ICA::HTX'
  ZRM-PolicyType: IT
  ZRM-PublishedDate: 2026-09-25 01:08:00
  ZRM-ReviewCycle: yearly
  ZRM-RiskAggregationEngine: "# Superseded Application MAX rollup design draft. Asset
    Risk Management scores each applicable ConfigItem separately through ZRM-RiskScoringEngine.\r\n#
    No aggregation program is executed for this Framework."
  ZRM-RiskMgtStateBook:
  - 'StateBook: ICA::Risk Management'
  ZRM-RiskScoringEngine: "# Assessment follows ZTicket-Parent to the ServiceRequest, then its ZRM-OriginatedEvent.\r\n# Risk and RiskStatement must select this same Framework.\r\nVERSION: 1\r\nASSESSMENT: INHERENT\r\nAPPLIES TO:\r\n  - ITSMConfigItem.Workload\r\n  - ITSMConfigItem.NetworkNode\r\n  - ITSMConfigItem.PeripheralNode\r\n  - ITSMConfigItem.StorageNode\r\n\r\nRISK STATEMENTS:\r\n  FROM: '@RISK.MELT-RiskStmt[RiskStatement][0]'\r\n  CLASS: GovernanceObject.RiskStatement\r\n  ON EMPTY: ERROR\r\n  FOR EACH: SCORE SEPARATELY\r\n\r\nBASE:\r\n  IMPACT:\r\n    FROM: CURRENT RISK STATEMENT.ZRM-BaseImpact\r\n  LIKELIHOOD:\r\n    FROM: CURRENT RISK STATEMENT.ZRM-BaseLikelihood\r\n  VALID RANGE: [1, 5]\r\n\r\nFACTOR RULE:\r\n  EFFECTIVE RANGE: (0, 1]\r\n  WHEN ZERO: 1\r\n  WHEN ABOVE ONE: 1\r\n  WHEN MISSING: 1\r\n  WHEN NEGATIVE OR NONNUMERIC: ERROR\r\n\r\nFACTORS:\r\n  - REFERENCE: ZTAM-Environment\r\n    IMPACT: ZRM-ImpactFactor\r\n    LIKELIHOOD: ZRM-LikelihoodFactor\r\n  - REFERENCE: ZTAM-Application.ZTSMAppSystem-CriticalityProfile\r\n    IMPACT: ZRM-ImpactFactor\r\n    LIKELIHOOD: ZRM-LikelihoodFactor\r\n  - REFERENCE: ZTAM-Application.ZTSMAppSystem-DataClassificationProfile\r\n    IMPACT: ZRM-ImpactFactor\r\n    LIKELIHOOD: ZRM-LikelihoodFactor\r\n  - REFERENCE: ZTAM-Application.ZTSMAppSystem-ExposureProfile\r\n    IMPACT: ZRM-ImpactFactor\r\n    LIKELIHOOD: ZRM-LikelihoodFactor\r\n  - REFERENCE: ZTAM-Application.ZTSMAppSystem-ServiceTier\r\n    IMPACT: ZRM-ImpactFactor\r\n    LIKELIHOOD: ZRM-LikelihoodFactor\r\n  - REFERENCE: ZTAM-FunctionProfile\r\n    IMPACT: ZRM-ImpactFactor\r\n    LIKELIHOOD: ZRM-LikelihoodFactor\r\n\r\nCALCULATE:\r\n  INHERENT IMPACT: CEIL(BASE.IMPACT * PRODUCT(NORMALIZE(FACTORS.IMPACT, FACTOR RULE)))\r\n  INHERENT LIKELIHOOD: CEIL(BASE.LIKELIHOOD * PRODUCT(NORMALIZE(FACTORS.LIKELIHOOD, FACTOR RULE)))\r\n  INHERENT RISK: INHERENT IMPACT * INHERENT LIKELIHOOD\r\n\r\nEVIDENCE:\r\n  FORMAT: 'Legacy calculation: {framework_name} for {context}; {framework_likelihood} x {framework_impact} = {framework_score}.'\r\n  FACTOR FORMAT: '{reference} ({object}): impact raw {raw_impact} -> effective {normalized_impact}; likelihood raw {raw_likelihood} -> effective {normalized_likelihood}'\r\n  AUTOMATION ARTICLE:\n    SUBJECT: 'Framework calculation: {framework_name} / {context}'\n    TITLE: 'Framework automatic calculation completed'\n    FORMAT: 'Framework {framework_name} v{framework_version}; base L{base_likelihood}, I{base_impact}; factors {factor_lines}; L=ceil({base_likelihood}x{likelihood_factor_chain})=ceil({likelihood_adjusted})={framework_likelihood}; I=ceil({base_impact}x{impact_factor_chain})=ceil({impact_adjusted})={framework_impact}; inherent score {framework_likelihood}x{framework_impact}={framework_score}.'  ARTICLE:\r\n    SUBJECT: 'Risk score: {framework_name} / {context}'\r\n    TITLE: 'Framework calculation log'\r\n    FORMAT: |\r\n      {framework_name} version {framework_version} scored {context}.\r\n      Factor rule: {factor_rule}.\r\n      Referenced profiles (raw -> effective):\r\n      {factor_lines}\r\n      Likelihood = ceil({base_likelihood} x {likelihood_factor_chain}) = ceil({likelihood_adjusted}) = {framework_likelihood}.\r\n      Impact = ceil({base_impact} x {impact_factor_chain}) = ceil({impact_adjusted}) = {framework_impact}.\r\n      Framework suggestion = {framework_likelihood} x {framework_impact} = {framework_score}.\r\n      Assessor selection = {submitted_likelihood} x {submitted_impact} = {submitted_score}.\r\n\r\nASSESSMENT RESULT:\r\n  TICKET TYPE: Assessment\r\n  FIELD: RiskAssessment\r\n  ROW TARGET: ZRM-RiskTargetCI\r\n  TARGET VALUE: CURRENT ASSET\r\n  ROW RISK STATEMENT: ZRM-RiskStatement\r\n  RISK STATEMENT VALUE: CURRENT RISK STATEMENT\r\n  SCORE FIELD: ZRM-InherentCalculatedRisk\r\n  SCORE VALUE: CALCULATE.INHERENT RISK\r\n\r\n# Each score dimension rounds up to its GeneralCatalog value."
  ZRM-Version: 2026.09.30
name: Asset Risk Management
number: GO-FRAMEWOR-00000002
object_type: GovernanceObject
version: '1'
ztsm_status: Active
