# Intended destination: Framework.ZRM-RiskScoringEngine.
# Assessment follows ZTicket-Parent to the ServiceRequest, then its ZRM-OriginatedEvent.
# Risk and RiskStatement must select this same Framework through MELT-RMF and ZRM-RMF.
VERSION: 1
ASSESSMENT: INHERENT
APPLIES TO:
  - ITSMConfigItem.Workload
  - ITSMConfigItem.NetworkNode
  - ITSMConfigItem.PeripheralNode
  - ITSMConfigItem.StorageNode

RISK STATEMENTS:
  FROM: '@RISK.MELT-RiskStmt[RiskStatement][0]'
  CLASS: GovernanceObject.RiskStatement
  ON EMPTY: ERROR
  FOR EACH: SCORE SEPARATELY

BASE:
  IMPACT:
    FROM: CURRENT RISK STATEMENT.ZRM-BaseImpact
  LIKELIHOOD:
    FROM: CURRENT RISK STATEMENT.ZRM-BaseLikelihood
  VALID RANGE: [1, 5]

FACTOR RULE:
  EFFECTIVE RANGE: (0, 1]
  WHEN ZERO: 1
  WHEN ABOVE ONE: 1
  WHEN MISSING: 1
  WHEN NEGATIVE OR NONNUMERIC: ERROR

FACTORS:
  - REFERENCE: ZTAM-Environment
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-CriticalityProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-DataClassificationProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-ExposureProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-ServiceTier
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-FunctionProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor

CALCULATE:
  INHERENT IMPACT: CEIL(BASE.IMPACT * PRODUCT(NORMALIZE(FACTORS.IMPACT, FACTOR RULE)))
  INHERENT LIKELIHOOD: CEIL(BASE.LIKELIHOOD * PRODUCT(NORMALIZE(FACTORS.LIKELIHOOD, FACTOR RULE)))
  INHERENT RISK: INHERENT IMPACT * INHERENT LIKELIHOOD

EVIDENCE:
  FORMAT: |
    {framework_name} (version {framework_version}) calculated inherent risk for {context}.
    Referenced profile factors (raw -> normalized):
    {factor_lines}
    Likelihood: base {base_likelihood} x {likelihood_factor_chain} = {likelihood_adjusted}; rounded up to catalog value {framework_likelihood}.
    Impact: base {base_impact} x {impact_factor_chain} = {impact_adjusted}; rounded up to catalog value {framework_impact}.
    Framework inherent score: {framework_likelihood} x {framework_impact} = {framework_score}.
    Submitted selection: {submitted_likelihood} x {submitted_impact} = {submitted_score}.

ASSESSMENT RESULT:
  TICKET TYPE: Assessment
  FIELD: ZRM-RiskAssessment
  ROW TARGET: ZRM-RiskTargetCI
  TARGET VALUE: CURRENT ASSET
  ROW RISK STATEMENT: ZRM-RiskStatement
  RISK STATEMENT VALUE: CURRENT RISK STATEMENT
  SCORE FIELD: ZRM-InherentCalculatedRisk
  SCORE VALUE: CALCULATE.INHERENT RISK

# Resolve base GeneralCatalog values by their numeric names, never their IDs.
# The score is calculated once per affected asset and RiskStatement. Repeated
# failures of Controls guarding the same statement add evidence, not factors.
# Multiple linked statements produce separate Risks and assessment rows.
# An empty reference set, wrong class, unresolved reference or missing/invalid
# base score is a calculation error, never a reason to choose another statement.
# A factor of 0 or above 1 is neutralized to 1; only values greater than 0 and
# below 1 reduce risk. Negative and nonnumeric factors are errors. A missing
# optional asset reference or blank factor contributes 1, but a broken populated
# reference is an error. Record raw and normalized inputs with the Framework version.
# With base dimensions at most 5 and normalized factors at most 1, inherent
# impact and likelihood stay at most 5, and inherent risk stays at most 25.
# Application has no direct risk factor. This program resolves four Application
# profiles separately. Platform's own calculation remains deferred.
# The score belongs to a row on the Assessment ticket, not to the MELT Risk.
# Factor-adjusted dimensions are rounded up to the 1-5 GeneralCatalog values
# stored in ZRM-InherentLikelihood and ZRM-InherentImpact. The score is their
# integer product. The server recalculates all three values on submission.
# ZRM-RiskStatement is single-value per row, matching this design.
# Residual risk and mitigation controls will be specified in a later version.
