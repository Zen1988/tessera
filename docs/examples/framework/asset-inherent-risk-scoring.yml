VERSION: 1
ASSESSMENT: INHERENT
APPLIES TO:
  - ITSMConfigItem.Workload
  - ITSMConfigItem.NetworkNode
  - ITSMConfigItem.PeripheralNode
  - ITSMConfigItem.StorageNode

RISK STATEMENTS:
  FROM: '@RISK.MELT-RiskStmt[RiskStatement][0]'
  CLASS: GovernanceObject.RiskStatement
  ON EMPTY: ERROR
  FOR EACH: SCORE SEPARATELY

BASE:
  IMPACT:
    FROM: CURRENT RISK STATEMENT.ZRM-BaseImpact
  LIKELIHOOD:
    FROM: CURRENT RISK STATEMENT.ZRM-BaseLikelihood
  VALID RANGE: [1, 5]

FACTOR RULE:
  EFFECTIVE RANGE: (0, 1]
  WHEN ZERO: 1
  WHEN ABOVE ONE: 1
  WHEN MISSING: 1
  WHEN NEGATIVE OR NONNUMERIC: ERROR

FACTORS:
  - REFERENCE: ZTAM-Environment
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-CriticalityProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-DataClassificationProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-ExposureProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-Application.ZTSMAppSystem-ServiceTier
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor
  - REFERENCE: ZTAM-FunctionProfile
    IMPACT: ZRM-ImpactFactor
    LIKELIHOOD: ZRM-LikelihoodFactor

CALCULATE:
  INHERENT IMPACT: CEIL(BASE.IMPACT * PRODUCT(NORMALIZE(FACTORS.IMPACT, FACTOR RULE)))
  INHERENT LIKELIHOOD: CEIL(BASE.LIKELIHOOD * PRODUCT(NORMALIZE(FACTORS.LIKELIHOOD, FACTOR RULE)))
  INHERENT RISK: INHERENT IMPACT * INHERENT LIKELIHOOD

EVIDENCE:
  FORMAT: 'Legacy calculation: {framework_name} for {context}; {framework_likelihood} x {framework_impact} = {framework_score}.'
  FACTOR FORMAT: '{reference} ({object}): impact raw {raw_impact} -> effective {normalized_impact}; likelihood raw {raw_likelihood} -> effective {normalized_likelihood}'
  ARTICLE:
    SUBJECT: 'Risk score: {framework_name} / {context}'
    TITLE: 'Framework calculation log'
    FORMAT: |
      {framework_name} version {framework_version} scored {context}.
      Factor rule: {factor_rule}.
      Referenced profiles (raw -> effective):
      {factor_lines}
      Likelihood = ceil({base_likelihood} x {likelihood_factor_chain}) = ceil({likelihood_adjusted}) = {framework_likelihood}.
      Impact = ceil({base_impact} x {impact_factor_chain}) = ceil({impact_adjusted}) = {framework_impact}.
      Framework suggestion = {framework_likelihood} x {framework_impact} = {framework_score}.
      Assessor selection = {submitted_likelihood} x {submitted_impact} = {submitted_score}.

ASSESSMENT RESULT:
  TICKET TYPE: Assessment
  FIELD: ZRM-RiskAssessment
  ROW TARGET: ZRM-RiskTargetCI
  TARGET VALUE: CURRENT ASSET
  ROW RISK STATEMENT: ZRM-RiskStatement
  RISK STATEMENT VALUE: CURRENT RISK STATEMENT
  SCORE FIELD: ZRM-InherentCalculatedRisk
  SCORE VALUE: CALCULATE.INHERENT RISK
