apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: tessera-web-backend-tls
  namespace: tessera
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: tessera-web
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: tessera-backend-ca
    hostname: portal.tessera.local
