# FUTURE Redis server template, after app backend TLS support is implemented.
# Server image must support TLS; mount certificates/auth externally.
port 0
tls-port 6379
tls-cert-file /run/tessera-tls/tls.crt
tls-key-file /run/tessera-tls/tls.key
tls-ca-cert-file /run/tessera-tls/ca.crt
tls-auth-clients yes
aclfile /run/tessera-redis-auth/users.acl
# Never enable this template against the current password-only backend before
# configuring and testing its TLS/client-certificate constructor options.
