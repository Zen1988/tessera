apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tessera-upgrade-bundle
  labels:
    app.kubernetes.io/managed-by: tessera-release-helper
    tessera-upgrade-bundle: "true"
spec:
  accessModes: [ReadWriteOnce]
  # Uses the cluster default StorageClass. Size for your actual OPM bundle.
  resources:
    requests:
      storage: 2Gi
