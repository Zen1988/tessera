server {
    listen 8443 ssl;
    server_name tessera.local portal.tessera.local;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/tessera-tls/tls.crt;
    ssl_certificate_key /run/tessera-tls/tls.key;
    ssl_client_certificate /run/tessera-tls/ca.crt;
    # Internal mTLS: ingress must present the separate ingress-client certificate.
    ssl_verify_client on;
    ssl_verify_depth 2;
    client_max_body_size 50m;
    location / {
        # TLS sidecar shares the application's network namespace/Pod.
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
