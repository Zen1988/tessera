# Standalone Apache configuration; stock sites-enabled/conf-enabled are not loaded.
ServerRoot /etc/apache2
ServerName portal.tessera.local
Include /etc/apache2/mods-enabled/*.load
Include /etc/apache2/mods-enabled/*.conf
User otobo
Group www-data
DefaultRuntimeDir /opt/otobo/var/run/apache
PidFile /opt/otobo/var/run/apache/apache.pid
Mutex file:/opt/otobo/var/run/apache default
ErrorLog /proc/self/fd/2
LogLevel warn
# Deliberately omit query strings, credentials, cookies and request bodies.
LogFormat "%a %t %m %U %>s %B %D" tessera
CustomLog /proc/self/fd/1 tessera
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
RequestReadTimeout handshake=20 header=20-40,MinRate=500 body=20,MinRate=500
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestBody 52428800
MaxConnectionsPerChild 1000
StartServers 2
MinSpareServers 2
MaxSpareServers 4
ServerLimit 16
MaxRequestWorkers 16
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>
# Leave application CSP, frame policy and article sandbox headers under app ownership.
Header always set X-Content-Type-Options "nosniff"
<IfDefine !TESSERA_CONFIGTEST>
    Listen 8443 https
    Include /etc/apache2/sites-enabled/tessera.conf
</IfDefine>
