# Native OTOBO 11.1 mod_perl/PSGI contract, retained from the installed host.
<IfModule !mod_perl.c>
    Error "TESSERA requires mod_perl"
</IfModule>
<IfModule mpm_event_module>
    Error "TESSERA requires mpm_prefork"
</IfModule>
<IfModule mpm_worker_module>
    Error "TESSERA requires mpm_prefork"
</IfModule>
PerlOptions +Parent
PerlPostConfigRequire /opt/otobo/scripts/apache2-perl-preload_otobo_psgi.pl
<Location />
    SetHandler perl-script
    PerlResponseHandler Plack::Handler::Apache2
    PerlSetVar psgi_app /opt/otobo/bin/psgi-bin/otobo.psgi
    Require all granted
    # TRACE is controlled globally with TraceEnable Off (not valid in Limit).
    <Limit TRACK CONNECT>
        Require all denied
    </Limit>
</Location>
# PSGI includes its own directory app; Apache Options -Indexes alone cannot stop it.
<LocationMatch "(?i)^/(?:otobo-web/static(?:/|$)|(?:Kernel|Custom|scripts|bin|var|vendor|local)(?:/|$)|\.)">
    Require all denied
</LocationMatch>
