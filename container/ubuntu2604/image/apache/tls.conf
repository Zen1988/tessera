SSLSessionCache shmcb:/opt/otobo/var/run/apache/ssl_scache(512000)
<VirtualHost *:8443>
    ServerName portal.tessera.local
    ServerAlias tessera.local
    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE+AESGCM:ECDHE+CHACHA20
    SSLHonorCipherOrder On
    SSLCompression Off
    SSLSessionTickets Off
    SSLCertificateFile /run/tessera-tls/tls.crt
    SSLCertificateKeyFile /run/tessera-tls/tls.key
    SSLCACertificateFile /run/tessera-tls/ca.crt
    # Ingress presents its separate TESSERA-issued client certificate.
    SSLVerifyClient require
    SSLVerifyDepth 1
    Include /usr/local/lib/tessera/apache/application.conf
</VirtualHost>
