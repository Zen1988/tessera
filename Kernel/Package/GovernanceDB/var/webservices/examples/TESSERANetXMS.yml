      },
      "History": {
        "Type": "NetXMS::History",
        "Description": "Read-only History",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "PathTrace": {
        "Type": "NetXMS::PathTrace",
        "Description": "Fixed read-only path query; requires source object execute-script permission",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "PathTraceL2": {
        "Type": "NetXMS::PathTraceL2",
        "Description": "Fixed read-only path query; requires source object execute-script permission",
        "Events": [],
        "MappingInbound": {},
