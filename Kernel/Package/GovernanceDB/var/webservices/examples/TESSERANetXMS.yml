{
  "Debugger": {
    "DebugThreshold": "error",
    "TestMode": "0"
  },
  "Description": "NetXMS read-only observation connector. Configure endpoint and dedicated restricted API token; no device credentials.",
  "RemoteSystem": "NetXMS",
  "Provider": {
    "Operation": {},
    "Transport": {
      "Type": ""
    }
  },
  "Requester": {
    "Invoker": {
      "ServerInfo": {
        "Type": "NetXMS::ServerInfo",
        "Description": "Read-only ServerInfo",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "Status": {
        "Type": "NetXMS::Status",
        "Description": "Read-only Status",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "Objects": {
        "Type": "NetXMS::Objects",
        "Description": "Read-only Objects",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "ObjectGet": {
        "Type": "NetXMS::ObjectGet",
        "Description": "Read-only ObjectGet",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "Alarms": {
        "Type": "NetXMS::Alarms",
        "Description": "Read-only Alarms",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "AlarmGet": {
        "Type": "NetXMS::AlarmGet",
        "Description": "Read-only AlarmGet",
        "Events": [],
        "MappingInbound": {},
        "MappingOutbound": {}
      },
      "CurrentValues": {
        "Type": "NetXMS::CurrentValues",
        "Description": "Read-only CurrentValues",
        "Events": [],
