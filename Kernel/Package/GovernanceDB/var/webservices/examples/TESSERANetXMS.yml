      }
    },
    "Transport": {
      "Type": "HTTP::REST",
      "Config": {
        "Host": "https://netxms.example.invalid",
        "Timeout": "30",
        "DefaultCommand": "GET",
        "SSL": {
          "UseSSL": "Yes",
          "SSLVerifyHostname": "Yes",
          "SSLVerifyMode": "Yes"
        },
        "AdditionalHeaders": {
          "Accept": "application/json"
        },
        "InvokerControllerMapping": {
          "ServerInfo": {
            "Controller": "/v1/server-info",
            "Command": "GET"
          },
          "Status": {
            "Controller": "/v1/status",
            "Command": "GET"
          },
          "Objects": {
            "Controller": "/v1/objects",
            "Command": "GET"
          },
          "ObjectGet": {
            "Controller": "/v1/objects/:ObjectID",
            "Command": "GET"
          },
          "Alarms": {
            "Controller": "/v1/alarms",
            "Command": "GET"
          },
          "AlarmGet": {
            "Controller": "/v1/alarms/:AlarmID",
            "Command": "GET"
          },
          "CurrentValues": {
            "Controller": "/v1/objects/:ObjectID/data-collection/current-values",
            "Command": "GET"
          },
          "DataCollection": {
            "Controller": "/v1/objects/:ObjectID/data-collection/configuration",
            "Command": "GET"
          },
          "History": {
            "Controller": "/v1/objects/:ObjectID/data-collection/:DCIID/history",
            "Command": "GET"
          },
          "PathTrace": {
            "Controller": "/v1/objects/:SourceID/execute-script",
            "Command": "POST"
          },
          "PathTraceL2": {
            "Controller": "/v1/objects/:SourceID/execute-script",
            "Command": "POST"
          }
        }
      }
    }
  }
