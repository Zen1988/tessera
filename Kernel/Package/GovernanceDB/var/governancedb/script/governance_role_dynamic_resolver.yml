---
SCRIPT: Resolve Governance Role Through Application Platform RoleMap
VERSION: 1

# CURRENT OBJECT is the GovernanceRole whose ZTSM-ScriptEngine is executing.
# The resolver loads the ticket Application and its referenced Platform as typed
# GovernanceObjects. RoleMap filtering is exact and fail-closed: zero or multiple
# matching GovernanceRole rows return UNKNOWN.
# Example: when CURRENT OBJECT is PLATFORM::NETWORK, this evaluates
# Application.Platform.RoleMap[GovernanceRole='PLATFORM::NETWORK'] and returns
# that row's SupportProfile.

RETURN:
  VALUE: TICKET.ZTicket-Application.ZTSMAppSystem-Platform.RoleMap[GovernanceRole=CURRENT OBJECT].SupportProfile
  AS: GovernanceObject.SupportProfile
