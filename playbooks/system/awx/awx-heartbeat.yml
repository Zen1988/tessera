
---
- name: AWX Execution Environment Heartbeat
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Collect execution environment statistics
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import os
            import platform
            import socket
            from datetime import datetime, timezone

            def read_number(path):
                try:
                    with open(path, encoding="utf-8") as f:
                        value = f.read().strip()
                    return None if value == "max" else int(value)
                except (OSError, ValueError):
                    return None

            def kernel_uptime():
                try:
                    with open("/proc/uptime", encoding="utf-8") as f:
                        return round(float(f.read().split()[0]), 2)
                except (OSError, ValueError, IndexError):
                    return None

            result = {
                "schema_version": "1.0",
                "check_type": "awx_execution_heartbeat",
                "status": "healthy",
                "timestamp_utc": datetime.now(
                    timezone.utc
                ).isoformat(),
                "execution_environment": {
                    "hostname": socket.gethostname(),
                    "os": platform.system(),
                    "architecture": platform.machine(),
                    "python_version": platform.python_version(),
                    "cpu_count_visible": os.cpu_count(),
                    "memory_used_bytes": read_number(
                        "/sys/fs/cgroup/memory.current"
                    ),
                    "memory_limit_bytes": read_number(
                        "/sys/fs/cgroup/memory.max"
                    ),
                    "node_kernel_uptime_seconds": kernel_uptime()
                }
            }
            print(json.dumps(result, sort_keys=True))
      register: heartbeat_command
      changed_when: false

    - name: Parse heartbeat result
      ansible.builtin.set_fact:
        heartbeat_result: "{{ heartbeat_command.stdout | from_json }}"

    - name: Publish TESSERA-compatible heartbeat artifact
      ansible.builtin.set_stats:
        data:
          tessera_heartbeat: "{{ heartbeat_result }}"
        per_host: false
        aggregate: false

    - name: Display structured heartbeat response
      ansible.builtin.debug:
        msg: "{{ heartbeat_result | to_json }}"
