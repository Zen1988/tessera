          storage system spanning multiple nodes, racks, or locations, commonly used
          for large-scale object storage.\r\n\r\nStorage Federation\r\nMultiple independent
          storage systems joined under a common management, replication, or service
          boundary.\r\n\r\nStorage Partition\r\nA bounded physical or logical allocation
