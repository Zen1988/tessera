- Definition: "---\r\nSections:\r\n  Analysis:\r\n    Content:\r\n    - Header: Analysis\r\n
    \   - DF: ZTAM-ImpactText\r\n    - DF: ZTAM-Recommendation\r\n    - DF: ZRM-PrivilegeRequired\r\n
    \   - DF: ZRM-AttackVector\r\n    - DF: ZRM-Complexity\r\n    - DF: ZRM-InteractionRequirement\r\n
    \   - DF: ZRM-Discoverability\r\n    - DF: ZRM-Reproducibility\r\n    - DF: ZRM-Confidentiality\r\n
    \   - DF: ZRM-Integrity\r\n    - DF: ZRM-Availability\r\n    - DF: ZRM-CodeExecution\r\n
    \   - DF: ZRM-PrivilegeEscalation\r\n    - DF: ZRM-AdditionalDamage\r\n  Impact:\r\n
    \   Content:\r\n    - Header: Impact Questionaire\r\n    - DF: ZRM-Confidentiality\r\n
    \   - DF: ZRM-Integrity\r\n    - DF: ZRM-Availability\r\n    - DF: ZRM-CodeExecution\r\n
    \   - DF: ZRM-PrivilegeEscalation\r\n    - DF: ZRM-AdditionalDamage\r\n  Likelihood:\r\n
    \   Content:\r\n    - Header: Likelihood Questionaire\r\n    - DF: ZRM-PrivilegeRequired\r\n
    \   - DF: ZRM-AttackVector\r\n    - DF: ZRM-InteractionRequirement\r\n    - DF:
    ZRM-Discoverability\r\n    - DF: ZRM-Complexity\r\n    - DF: ZRM-Reproducibility\r\n
    \ Meta:\r\n    Content:\r\n    - Header: General Information\r\n    - DF: ZTAM-Annex\r\n
    \   - DF: ZTAM-AdvisoryType\r\n    - DF: ZTAM-Source\r\n    - DF: ZTAM-CVE\r\n
    \   - DF: ZTAM-EventSeverity\r\n    - DF: ZTAM-Status\r\n    - DF: ZTAM-IssuedDate\r\n
    \   - DF: ZTAM-DueDate\r\n    - DF: ZTAM-closure\r\n    - DF: AdvancedCondition\r\n
    \ Others:\r\n    Content:\r\n    - Header: Others\r\n    - DF: ZTAM-Application\r\n
    \   - DF: ZTAM-ContractEntitlement"
  RoleName: SecurityAdvisory
- Class:
    Categories:
    - Control
