  Definition: "---\r\nPages:\r\n  # The individual tabs in AgentITSMConfigItemZoom
    are called Pages.\r\n  # The fields to be displayed there are defined in the roles
    \r\n  # listed on the left under \"Roles\".\r\n  - Name: Summary\r\n    Layout:\r\n
    \     Columns: 2\r\n      ColumnWidth: 1fr 1fr\r\n    Interfaces:\r\n      - Agent\r\n
    \   Content:\r\n      - Section: Node::Meta\r\n        RowStart: 1\r\n        ColumnStart:
    1\r\n      - Section: Node::Capacity\r\n        RowStart: 2\r\n        ColumnStart:
    1\r\n      - Section: Node::Build\r\n        RowStart: 3\r\n        ColumnStart:
    1\r\n      - Section: Node::Runtime\r\n        RowStart: 4\r\n        ColumnStart:
    1\r\n      - Section: Node::Config\r\n        RowStart: 5\r\n        ColumnStart:
    1\r\n      - Section: CMDB Backlinks::Backlinks\r\n        RowStart: 3\r\n        ColumnStart:
    2\r\n      - Section: CMDB Description::Description\r\n        RowStart: 1\r\n
    \       RowSpan: 2\r\n        ColumnStart: 2\r\n\r\nRoles:\r\n  # Roles are used
    to define the Sections and their individual fields.\r\n  # Of course, sections
    can also be defined directly here in the class definitions. \r\n  # We have simply
    moved them to \"Roles\" for the sake of clarity.\r\n\r\n  # For each class with
    class-specific fields, there is a \"General Fields\"\r\n  # definition referring
    to a role with the name \"ITSM GF class name\". \r\n  # This is where the fields
    of the respective class can be customised.\r\n  Node:\r\n    Name: StorageNode\r\n
    \ CMDB Backlinks:\r\n    Name: CMDB Backlinks\r\n  CMDB Description:\r\n    Name:
    CMDB Description"
