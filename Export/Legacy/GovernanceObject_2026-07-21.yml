  Definition: "---\r\nPages:\r\n  # The individual tabs in AgentGovernanceObjectZoom
    are called Pages.\r\n  # The fields to be displayed there are defined in the roles
    \r\n  # listed on the left under \"Roles\".\r\n  - Name: Summary\r\n    Layout:\r\n
    \     Columns: 2\r\n      ColumnWidth: 1fr 1fr\r\n    Interfaces:\r\n      - Agent\r\n
    \   Content:\r\n      - Section: General Fields::Application\r\n        RowStart:
    1\r\n        ColumnStart: 1\r\n      - Section: GovernanceDB Backlinks::Backlinks\r\n
    \       RowStart: 2\r\n        ColumnStart: 1\r\n      - Section: GovernanceDB
    Description::Description\r\n        RowStart: 1\r\n        RowSpan: 2\r\n        ColumnStart:
    2\r\n        \r\nRoles: \r\n  # Roles are used to define the Sections and their
    individual fields.\r\n  # Of course, sections can also be defined directly here
    in the class definitions. \r\n  # We have simply moved them to \"Roles\" for the
    sake of clarity.\r\n\r\n  # For each class with class-specific fields, there is
    a \"General Fields\"\r\n  # definition referring to a role with the name \"GovernanceDB
    GF class name\". \r\n  # This is where the fields of the respective class can
    be customised.\r\n  General Fields:\r\n    Name: ZTSM Application\r\n  GovernanceDB
    Backlinks:\r\n    Name: GovernanceDB Backlinks\r\n  GovernanceDB Description:\r\n
    \   Name: GovernanceDB Description"
