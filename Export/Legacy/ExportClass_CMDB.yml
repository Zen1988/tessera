          Retired: Retired
          Suspended: Suspended
        Tooltip: Governance / operational validity
        TranslatableValues: '0'
        TreeView: '0'
      FieldType: Dropdown
      Label: Status
      Name: ZTSM-Status
      ObjectType: ITSMConfigItem
