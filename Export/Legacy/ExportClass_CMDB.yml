- Class:
    Categories:
    - Governance
    Name: BlueBook
    NumberModule: AutoIncrement
    PermissionGroup: itsm-configitem
    VersionStringModule: Incremental
    VersionTrigger:
    - DefinitionUpdate
    - DeplStateID
    - Description
    - Name
  Definition: "---\r\nPages:\r\n  # The individual tabs in AgentITSMConfigItemZoom
    are called Pages.\r\n  # The fields to be displayed there are defined in the roles
    \r\n  # listed on the left under \"Roles\".\r\n  - Name: Summary\r\n    Layout:\r\n
    \     Columns: 2\r\n      ColumnWidth: 1fr 1fr\r\n    Interfaces:\r\n      - Agent\r\n
    \   Content:\r\n      - Section: General Fields::BlueBook\r\n        RowStart:
    1\r\n        ColumnStart: 1\r\n      - Section: CMDB Backlinks::Backlinks\r\n
    \       RowStart: 2\r\n        ColumnStart: 1\r\n      - Section: CMDB Description::Description\r\n
    \       RowStart: 1\r\n        RowSpan: 2\r\n        ColumnStart: 2\r\n        \r\nRoles:
    \r\n  # Roles are used to define the Sections and their individual fields.\r\n
    \ # Of course, sections can also be defined directly here in the class definitions.
    \r\n  # We have simply moved them to \"Roles\" for the sake of clarity.\r\n\r\n
    \ # For each class with class-specific fields, there is a \"General Fields\"\r\n
    \ # definition referring to a role with the name \"ITSM GF class name\". \r\n
    \ # This is where the fields of the respective class can be customised.\r\n  General
    Fields:\r\n    Name: ZTSM Blue Book\r\n  CMDB Backlinks:\r\n    Name: CMDB Backlinks\r\n
    \ CMDB Description:\r\n    Name: CMDB Description"
  DynamicFields:
    ZBlue-Record:
      CIClass: BlueBook
      Config:
        Include:
        - DF: ZBlue-Chapter
          Definition:
            CIClass: BlueBook
            Config:
              DefaultValue: BR-001
              Link: ''
              LinkPreview: ''
              MultiValue: '0'
              RegExList: []
              Tooltip: Chapter ID (make sure it unique inside BlueBook)
            FieldType: Text
            Label: ID
            Name: ZBlue-Chapter
            ObjectType: ITSMConfigItem
        - DF: ZBlue-BlueLevel
          Definition:
            CIClass: BlueBook
            Config:
              Class: BlueLevel
              MultiValue: '0'
              Multiselect: ~
              PossibleNone: '0'
              Tooltip: Blue Level
            FieldType: GeneralCatalog
            Label: Level
            Name: ZBlue-BlueLevel
            ObjectType: ITSMConfigItem
        - DF: ZBlue-Profile
          Definition:
            CIClass: BlueBook
            Config:
              ClassIDs:
              - Governance Role
              - Support Profile
              DeplStateIDs: []
              DisplayType: ''
              EditFieldMode: Dropdown
              ImportSearchAttribute: ''
              LinkDirection: ReferencingIsSource
              LinkReferencingType: Dynamic
              LinkType: ''
              MultiValue: '0'
              Multiselect: '0'
              PossibleNone: '0'
              ReferenceFilterList: []
              ReferencedObjectType: ITSMConfigItem
              SearchAttribute: ''
              Tooltip: Support/Approval Profile
            FieldType: ConfigItem
            Label: Profile
            Name: ZBlue-Profile
            ObjectType: ITSMConfigItem
        - DF: ZBlue-Role
          Definition:
            CIClass: BlueBook
            Config:
              ClassIDs:
              - Governance Role
              DeplStateIDs: []
              DisplayType: ''
              EditFieldMode: Dropdown
              ImportSearchAttribute: ''
              LinkDirection: ReferencingIsSource
              LinkReferencingType: Dynamic
              LinkType: ''
              MultiValue: '0'
              Multiselect: '0'
              PossibleNone: '1'
              ReferenceFilterList: []
              ReferencedObjectType: ITSMConfigItem
              SearchAttribute: ''
              Tooltip: Role
            FieldType: ConfigItem
            Label: Role
            Name: ZBlue-Role
            ObjectType: ITSMConfigItem
        - DF: ZBlue-TicketType
          Definition:
            CIClass: BlueBook
            Config:
              Class: ZTSM::Type
              MultiValue: '0'
              Multiselect: ~
              PossibleNone: '0'
              Tooltip: Ticket Type
            FieldType: GeneralCatalog
            Label: Ticket Type
            Name: ZBlue-TicketType
            ObjectType: ITSMConfigItem
        - DF: ZBlue-Activity
          Definition:
            CIClass: BlueBook
            Config:
              DefaultValue: ''
              Link: ''
              LinkPreview: ''
              MultiValue: '0'
              RegExList: []
              Tooltip: Activity
            FieldType: Text
            Label: Activity
            Name: ZBlue-Activity
            ObjectType: ITSMConfigItem
        - DF: ZBlue-Duration
          Definition:
            CIClass: BlueBook
            Config:
              DefaultValue: '120'
              Link: ''
              LinkPreview: ''
              MultiValue: '0'
              RegExList:
              - ErrorMessage: Duration must be in numbers only
                Value: ^[0-9]+$
              Tooltip: Duration (mins)
            FieldType: Text
            Label: Duration (mins)
            Name: ZBlue-Duration
            ObjectType: ITSMConfigItem
        - DF: ZBlue-RequiredWeightage
          Definition:
            CIClass: BlueBook
            Config:
              DefaultValue: '1'
              Link: ''
              LinkPreview: ''
              MultiValue: '0'
              RegExList:
              - ErrorMessage: Weightage must be number format
                Value: ^[0-9]+$
              Tooltip: Required Weightage
            FieldType: Text
            Label: Required Weightage
            Name: ZBlue-RequiredWeightage
            ObjectType: ITSMConfigItem
        - DF: ZBlue-Mandatory
          Definition:
            CIClass: BlueBook
            Config:
              DefaultValue: '0'
              MultiValue: ~
              Tooltip: Mandatory
            FieldType: Checkbox
            Label: Mandatory
            Name: ZBlue-Mandatory
            ObjectType: ITSMConfigItem
        - DF: ZBlue-Strict
          Definition:
            CIClass: BlueBook
            Config:
              DefaultValue: '0'
              MultiValue: ~
              Tooltip: Strict Mode
            FieldType: Checkbox
            Label: Strict
            Name: ZBlue-Strict
            ObjectType: ITSMConfigItem
        MultiValue: '1'
        Tooltip: ~
      FieldType: Set
      Label: BlueBook Chapters
      Name: ZBlue-Record
      ObjectType: ITSMConfigItem
    ZTSM-Status:
      CIClass: BlueBook
      Config:
        DefaultValue: Draft
        Link: ''
        LinkPreview: ''
